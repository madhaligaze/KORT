# Будильник прода на бесплатном Render - временно, до возврата на Railway.
#
# Бесплатный сервис Render засыпает через 15 минут без запросов, а запросы
# kort.cards API не будят: край Render отвечает прокси фронта мгновенным 502.
# Будит только запрос снаружи прямо на адрес API. Отсюда: с 7 утра до 10 вечера
# по Астане (UTC+5) раз в 5 минут - фронт и API.
#
# Сначала будильник спрашивает фронт, где API (`/api/hosting`), и будит только
# при "render". Railway он не трогает никогда: после возврата туда разбуженный
# API на Render был бы вторым процессом на той же базе - второй бот в канале,
# второй проход 1С. Фронт не ответил или ответил не "render" - не делает ничего.
#
# Адрес API на Render - секрет RENDER_API_URL: журнал прогона публичный, а
# секреты GitHub в нём прячет.
name: Будильник Render

on:
  schedule:
    - cron: "52-59/5 1 * * *" # 06:52, 06:57 по Астане - к 7:00 уже поднят
    - cron: "2-59/5 2-16 * * *" # 07:02 - 21:57 по Астане, засыпает около 22:12
  workflow_dispatch:

concurrency:
  group: render-wake
  cancel-in-progress: false

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Разбудить фронт и API, если прод на Render
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          # Вопрос будит и сам фронт: Render держит запрос, пока сервис поднимается.
          api=$(curl -s --max-time 150 https://kort.cards/api/hosting | jq -r '.api // empty' 2>/dev/null || true)
          echo "API на хостинге: ${api:-фронт не ответил}"
          if [ "$api" != "render" ]; then
            echo "Не Render - будить нечего"
            exit 0
          fi
          if [ -z "$RENDER_API_URL" ]; then
            echo "::warning::Нет секрета RENDER_API_URL - API не разбужен"
            exit 0
          fi
          # Подъём API - около 2 минут, Render держит запрос до конца.
          echo "API напрямую: $(curl -s -o /dev/null -w '%{http_code} за %{time_total} с' --max-time 240 "${RENDER_API_URL%/}/api/v1/health/live" || true)"
          echo "Через kort.cards: $(curl -s -o /dev/null -w '%{http_code} за %{time_total} с' --max-time 60 https://kort.cards/api/backend/api/v1/health/live || true)"
